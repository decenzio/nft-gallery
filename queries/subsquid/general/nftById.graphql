#import "../../fragments/nft.graphql"
#import "../../fragments/nftDetails.graphql"

query nftById($id: String!) {
  nftEntity: nftEntityById(id: $id) {
    ...nft
    ...nftDetails
    collection {
      id
      name
      currentOwner
      floorPrice: nfts(
        where: { burned_eq: false, price_not_eq: "0" }
        orderBy: price_ASC
        limit: 1
      ) {
        price
      }
    }
    attributes {
      trait
      value
    }
    events {
      interaction
      timestamp
      meta
    }
    meta {
      id
      name
      description
      image
      animationUrl
      attributes {
        trait
        value
      }
    }
    royalty
    recipient
  }
}
